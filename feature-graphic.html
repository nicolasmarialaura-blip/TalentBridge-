<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>tNic — Feature Graphic 1024×500</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1a1a2a;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}

/* Wrapper que asegura tamaño exacto y permite zoom */
.canvas{
  width:1024px;height:500px;
  background:linear-gradient(125deg,#0F172A 0%,#142450 30%,#1F44B8 65%,#2B5CE6 100%);
  position:relative;overflow:hidden;
  display:flex;align-items:center;
  border-radius:0; /* Play Store no espera radius */
  box-shadow:0 0 60px rgba(0,0,0,.5); /* solo para preview, no afecta screenshot */
}

/* Decoración de fondo: puntitos sutiles */
.dots{
  position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.06) 1.5px,transparent 1.5px);
  background-size:24px 24px;
  pointer-events:none;
}
/* Glow circles atrás */
.glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;pointer-events:none}
.glow-1{width:340px;height:340px;background:#6091FF;top:-100px;right:-80px}
.glow-2{width:280px;height:280px;background:#7C3AED;bottom:-90px;left:30%}

/* ── Lado izquierdo: branding ── */
.left{
  position:relative;z-index:2;
  padding:50px 56px;
  width:58%;color:#fff;
}
.brand{
  font-family:'Syne',sans-serif;
  font-size:96px;
  font-weight:800;
  line-height:1;
  letter-spacing:-3px;
  margin-bottom:22px;
  display:flex;align-items:baseline;
}
.brand .t{color:#fff}
.brand .nic{color:#6091FF;margin-left:-4px}
.tagline{
  font-size:26px;font-weight:700;line-height:1.2;
  color:#fff;max-width:480px;
  margin-bottom:14px;
}
.tagline em{color:#9bb4ff;font-style:normal}
.subtitle{
  font-size:14px;font-weight:600;
  color:rgba(255,255,255,.6);
  letter-spacing:.3px;
  text-transform:uppercase;
}
.cta-pill{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:30px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;padding:8px 18px;
  font-size:13px;font-weight:700;color:#fff;
  backdrop-filter:blur(8px);
}

/* ── Lado derecho: visual de matching ── */
.right{
  position:relative;z-index:2;
  width:42%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
.match-vis{
  position:relative;
  display:flex;align-items:center;gap:24px;
}
.avatar{
  width:120px;height:120px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:54px;
  color:#fff;
  box-shadow:0 12px 32px rgba(0,0,0,.4);
  border:4px solid rgba(255,255,255,.15);
}
.av-cand{background:linear-gradient(135deg,#7C3AED,#A855F7)}
.av-comp{background:linear-gradient(135deg,#2B5CE6,#6091FF)}
.heart{
  font-size:50px;
  filter:drop-shadow(0 0 20px rgba(96,145,255,.7));
  animation:none; /* no animar para que el screenshot sea estable */
}
.connector{
  position:absolute;
  top:50%;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4) 30%,rgba(255,255,255,.4) 70%,transparent);
  z-index:-1;
}
.badge-mi{
  position:absolute;top:-50px;left:50%;transform:translateX(-50%);
  background:rgba(96,145,255,.18);
  border:1px solid rgba(96,145,255,.45);
  padding:6px 14px;border-radius:999px;
  font-size:11px;font-weight:800;color:#9bb4ff;
  letter-spacing:.8px;white-space:nowrap;
  backdrop-filter:blur(8px);
}

/* Skills floating tags como guiño al producto */
.skills-bg{position:absolute;inset:0;pointer-events:none;z-index:1}
.skill-tag{
  position:absolute;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  padding:4px 10px;
  font-size:10px;font-weight:600;color:rgba(255,255,255,.5);
  font-family:'Plus Jakarta Sans',sans-serif;
}
.skill-tag.s1{top:30px;right:60px;transform:rotate(-3deg)}
.skill-tag.s2{bottom:60px;right:30px;transform:rotate(4deg)}
.skill-tag.s3{top:80px;left:30px;transform:rotate(-5deg)}

/* Helper para tomar el screenshot: oculta info de instrucción al imprimir */
.helper{
  position:absolute;bottom:-44px;left:0;right:0;text-align:center;
  font-size:13px;color:rgba(255,255,255,.5);font-family:'Plus Jakarta Sans',sans-serif;
}
</style>
</head>
<body>

<div class="canvas">
  <div class="dots"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="left">
    <div class="brand"><span class="t">t</span><span class="nic">Nic</span></div>
    <div class="tagline">Talento IT que se <em>elige mutuamente</em>.</div>
    <div class="subtitle">Matching profesional · LATAM</div>
    <div class="cta-pill">🎯 Swipe · Match · Chat directo</div>
  </div>

  <div class="right">
    <div class="skills-bg">
      <div class="skill-tag s1">React + Node</div>
      <div class="skill-tag s2">Python · AWS</div>
      <div class="skill-tag s3">Product Design</div>
    </div>
    <div class="match-vis">
      <div class="badge-mi">✨ MUTUAL INTEREST</div>
      <div class="connector"></div>
      <div class="avatar av-cand">M</div>
      <div class="heart">💙</div>
      <div class="avatar av-comp">E</div>
    </div>
  </div>
</div>

</body>
</html>
